services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copie .env.compose.example para .env.compose}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - econoway_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./node_backend
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_ISSUER: econoway-api
      JWT_AUDIENCE: econoway-clients
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      NFCE_ALLOWED_HOSTS: www.nfce.fazenda.sp.gov.br,www.homologacao.nfce.fazenda.sp.gov.br
      PRICE_FRESHNESS_HOURS: 168
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:?defina DEMO_USER_EMAIL}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?defina DEMO_USER_PASSWORD}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:?defina DEMO_ADMIN_EMAIL}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?defina DEMO_ADMIN_PASSWORD}
      DEMO_MARKET_EMAIL: ${DEMO_MARKET_EMAIL:?defina DEMO_MARKET_EMAIL}
      DEMO_MARKET_PASSWORD: ${DEMO_MARKET_PASSWORD:?defina DEMO_MARKET_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate:prod && npm run seed:demo:prod && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "3333:3333"

  web:
    build:
      context: ./web_frontend
      args:
        VITE_API_URL: http://localhost:3333/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5173:80"

volumes:
  econoway_pgdata:
