name: Atualizar Estatísticas do README

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
    
      - name: Executar script de atualização do README
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_readme.py
    
      - name: Commit e push das alterações se houver mudança
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: atualiza automaticamente as estatísticas de linguagens [skip ci]"
          git push origin main